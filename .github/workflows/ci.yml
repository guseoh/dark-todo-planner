name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tern-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      backend: ${{ steps.scope.outputs.backend }}
      crypto: ${{ steps.scope.outputs.crypto }}
      audit: ${{ steps.scope.outputs.audit }}
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify change classification
        run: node --test scripts/ci-scope.check.mjs
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-scope.mjs

  test-build-audit:
    name: Test, build, and audit
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci
      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck
      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: npm test
      - name: Validate release preparation without real signing keys
        if: needs.changes.outputs.desktop == 'true'
        run: node --test scripts/prepare-desktop-release.check.mjs
      - name: Build desktop frontend without packaging
        if: needs.changes.outputs.desktop == 'true'
        run: npx --no-install vite build --base=./
      - name: Backup cryptography regression tests
        if: needs.changes.outputs.crypto == 'true'
        run: node --test scripts/d1-backup-crypto.check.mjs
      - name: Audit production dependencies
        if: needs.changes.outputs.audit == 'true'
        run: npm audit --omit=dev
      - name: No application changes
        if: needs.changes.outputs.code != 'true'
        run: echo "Documentation-only change; application checks not needed."

  smoke-local-api:
    name: Local API regression gate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/api-check.yml

  result:
    name: CI result
    if: always()
    needs: [changes, test-build-audit, smoke-local-api]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          CHANGES: ${{ needs.changes.result }}
          QUICK: ${{ needs.test-build-audit.result }}
          API: ${{ needs.smoke-local-api.result }}
          BACKEND: ${{ needs.changes.outputs.backend }}
        run: |
          test "$CHANGES" = success
          test "$QUICK" = success
          if [ "$BACKEND" = true ]; then test "$API" = success; else test "$API" = skipped; fi
