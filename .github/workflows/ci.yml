name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-audit:
    name: Test, build, and audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and Wrangler dry-run
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  smoke-local-api:
    name: Local Worker + D1 API smoke
    needs: test-build-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Initialize isolated local D1
        run: npm run db:migrate:local

      - name: Generate ephemeral smoke credentials
        run: node scripts/prepare-smoke-auth.mjs

      - name: Start local Worker
        run: |
          npx wrangler dev --local --port 8787 > /tmp/dtp-local-smoke.log 2>&1 &
          echo $! > /tmp/dtp-local-smoke.pid

      - name: Exercise authenticated CRUD and recovery
        run: node scripts/smoke-local-api.mjs

      - name: Report Worker startup errors if failed
        if: failure()
        run: |
          echo "Local Worker error diagnostics (last 80 lines):"
          tail -n 80 /tmp/dtp-local-smoke.log || true

  deploy-production:
    name: Deploy production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test-build-audit, smoke-local-api]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dark-todo-planner.guseoh.workers.dev
    concurrency:
      group: dark-todo-planner-production
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub Secret CLOUDFLARE_API_TOKEN is required for production deployment."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub Secret CLOUDFLARE_ACCOUNT_ID is required for production deployment."
            exit 1
          fi

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:production

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:production

      - name: Verify production health
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 3 --retry-all-errors \
            https://dark-todo-planner.guseoh.workers.dev/api/health
