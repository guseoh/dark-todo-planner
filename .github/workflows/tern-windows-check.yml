name: Tern Windows build check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tern-windows-check.yml'

concurrency:
  group: tern-native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build:
    name: Compile Tauri Windows app without release secrets
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - run: npm ci
      - name: Build frontend assets for Tauri compile check
        run: npx --no-install vite build --base=./
      - name: Generate icons
        run: npx --yes @tauri-apps/cli@2 icon -o src-tauri/icons src-tauri/branding/tern.png
      - name: Resolve initial lockfile (temporary bootstrap)
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'TERN_CARGO_LOCK_START'
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path src-tauri/Cargo.lock)))
          for ($i = 0; $i -lt $encoded.Length; $i += 120) { Write-Output ('TERN_LOCK:' + $encoded.Substring($i, [Math]::Min(120, $encoded.Length - $i))) }
          Write-Output 'TERN_CARGO_LOCK_END'
      - name: Check native Windows code without linking or packaging
        run: cargo check --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
