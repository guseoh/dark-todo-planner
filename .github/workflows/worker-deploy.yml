name: Cloudflare API and D1 deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dark-todo-planner-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend API
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dark-todo-planner.guseoh.workers.dev/api/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build worker
        run: npm run build
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:production
      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:production
      - name: Check backend health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://dark-todo-planner.guseoh.workers.dev/api/health
