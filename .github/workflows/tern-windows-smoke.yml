name: Tern native startup smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/tern-windows-smoke.yml']

permissions:
  contents: read

concurrency:
  group: tern-native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - run: npm ci
      - run: npx --yes @tauri-apps/cli@2 icon -o src-tauri/icons src-tauri/branding/tern.png
      - name: Compile executable only
        run: npx --yes @tauri-apps/cli@2 build --no-bundle -- --locked
      - name: Run native unit tests (same release profile, no installer)
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --lib
      - name: Check native startup without login or data mutation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'src-tauri/target/release/tern.exe'
          function Wait-TernWindow($process) {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Tern exited before startup ($($process.ExitCode))" }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0 -or $process.MainWindowTitle -notmatch 'Tern') { throw 'Tern main window was not detected' }
          }
          $p = Start-Process -FilePath $exe -PassThru
          try {
            Wait-TernWindow $p
            $second = Start-Process -FilePath $exe -PassThru
            try {
              if (!$second.WaitForExit(15000)) { throw 'Second app instance did not exit' }
              if ($second.ExitCode -ne 0) { throw "Second app returned $($second.ExitCode)" }
            } finally {
              if (!$second.HasExited) { Stop-Process -Id $second.Id -Force }
            }
            Start-Sleep -Seconds 3
            $p.Refresh()
            if ($p.HasExited) { throw 'Tern exited after startup' }
            Write-Output 'Tern first window detected; second instance exits.'
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force; $p.WaitForExit() }
          }
          $reopened = Start-Process -FilePath $exe -PassThru
          try {
            Wait-TernWindow $reopened
            Write-Output 'Tern reopened after first process termination; OS lock recovered.'
          } finally {
            if (!$reopened.HasExited) { Stop-Process -Id $reopened.Id -Force }
          }
