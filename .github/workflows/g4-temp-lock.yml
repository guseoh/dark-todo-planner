name: G4 temporary lockfile generator
on:
  push:
    branches:
      - feat/ui-v2-g4-scratchpad-wysiwyg
permissions:
  contents: write
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate deterministic npm lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated dependency graph
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build(g4): generate Tiptap dependency lock'
          git push origin HEAD:refs/heads/feat/ui-v2-g4-scratchpad-wysiwyg
