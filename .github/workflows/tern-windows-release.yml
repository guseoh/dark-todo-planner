name: Tern Windows release

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tern-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    name: Build, sign and publish Windows Tern
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require explicitly bumped and unpublished version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node scripts/prepare-desktop-release.mjs --version
          if ($LASTEXITCODE -ne 0) { throw 'Invalid tracked version' }
          $env:TERN_LATEST_TAG = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify latest published release' }
          node scripts/prepare-desktop-release.mjs --check-newer
          if ($LASTEXITCODE -ne 0) { throw 'Version must increase explicitly' }
          git ls-remote --exit-code origin "refs/tags/tern-v$version"
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -eq 0) { throw 'Version tag already exists; never overwrite a published or partial release' }
          if ($tagStatus -ne 2) { throw 'Cannot verify release tag' }
          Write-Output "Release version: $version"
          exit 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify main before signing and publishing
        run: |
          npm test
          node --test scripts/ci-scope.check.mjs scripts/prepare-desktop-release.check.mjs
      - name: Prepare version and registered updater public key
        env:
          TERN_UPDATER_PUBLIC_KEY: ${{ secrets.TERN_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-desktop-release.mjs
      - name: Confirm release lockfile remains valid
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps
      - name: Generate Windows icons from tracked source image
        run: npx --yes @tauri-apps/cli@2 icon -o src-tauri/icons src-tauri/branding/tern.png
      - name: Build and publish signed Windows installer and latest.json
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: tern-v__VERSION__
          releaseName: 'Tern __VERSION__'
          releaseBody: 'Windows 11 x64 Tern 앱입니다. main 변경에서 생성된 서명된 설치 파일과 자동 업데이트용 latest.json을 포함합니다. 데이터는 기존 Cloudflare D1에 보관됩니다. v0.2.0에서 새 서명 키로 전환하는 최초 설치는 이 릴리스의 설치 파일을 직접 실행하세요. 이후 앱에서 새 버전을 확인할 수 있습니다.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: '--bundles nsis -- --locked'
