name: Encrypted Production D1 Backup

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday 03:00 Asia/Seoul (Sunday 18:00 UTC).
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: dark-todo-planner-encrypted-backup
  cancel-in-progress: false

jobs:
  backup-production-d1:
    name: Read-only export and encrypt
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate all backup secrets before touching D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_BACKUP_KEY_B64: ${{ secrets.D1_BACKUP_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_BACKUP_KEY_B64" ]; then
            echo "::error::Set Cloudflare credentials and D1_BACKUP_KEY_B64 in production environment secrets. The export did not run."
            exit 1
          fi
          node --input-type=module -e 'import { parseD1BackupKey } from "./scripts/d1-backup-crypto.mjs"; parseD1BackupKey(process.env.D1_BACKUP_KEY_B64);'
      - name: Verify authenticated encryption implementation
        run: node --test scripts/d1-backup-crypto.check.mjs

      - name: Export Production D1 (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:backup:production

      - name: Encrypt SQL and remove plaintext
        env:
          D1_BACKUP_KEY_B64: ${{ secrets.D1_BACKUP_KEY_B64 }}
        run: |
          set -euo pipefail
          RAW=$(find backups/d1/production -maxdepth 1 -type f -name '*.sql' -print -quit)
          if [ -z "$RAW" ]; then
            echo "::error::Production D1 export did not create a SQL file."
            exit 1
          fi
          node scripts/d1-backup-crypt.mjs encrypt "$RAW" "$RAW.d1enc"
          test ! -e "$RAW"
          test -s "$RAW.d1enc"

      - name: Upload encrypted backup only (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-encrypted-${{ github.run_id }}
          path: backups/d1/production/*.d1enc
          if-no-files-found: error
          retention-days: 30
